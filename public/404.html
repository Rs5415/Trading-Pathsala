<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Pathshala - Stock Market Education</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      // This script takes the current URL and converts the path and query
      // into a query string, then redirects the browser to the base URL.
      (function () {
        // If served from a GitHub Pages repository subfolder (/Trading-Pathsala), keep 1 segment.
        // If served from a custom domain (e.g., https://tradingpathsala.in/), keep 0 segments.
        var pathSegmentsToKeep = window.location.pathname.startsWith('/Trading-Pathsala') ? 1 : 0;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #FCFBF7; color: #18181B; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px;">
    <div>
      <h2 style="font-size: 1.25rem; font-weight: 700; color: #18181B; margin-bottom: 8px;">
        Redirecting to Trading Pathshala...
      </h2>
      <p style="font-size: 0.875rem; color: #71717A; margin-bottom: 16px;">
        Loading requested page without reload.
      </p>
      <noscript>
        <p style="font-size: 0.875rem; color: #916E16;">
          JavaScript is required to navigate to this page. <a href="/Trading-Pathsala/" style="color: #916E16; font-weight: bold;">Return to Home</a>
        </p>
      </noscript>
    </div>
  </body>
</html>
